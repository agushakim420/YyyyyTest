name: Build KernelSU Next Extended for HyperOS 2

on:
  workflow_dispatch:
    inputs:
      ANDROID_VERSION:
        description: 'Android Version'
        required: true
        default: '14'
        type: choice
        options:
        - '14'
        - '13'
      KSU_VERSION:
        description: 'KernelSU Version'
        required: true
        default: 'main'
        type: choice
        options:
        - main
        - next
      CLEAN_BUILD:
        description: 'Clean Build'
        required: true
        default: true
        type: boolean

env:
  TZ: Asia/Jakarta
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    
    permissions:
      contents: write
      packages: write
      actions: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean Workspace
      run: |
        echo "=== Cleaning workspace ==="
        rm -rf kernel
        rm -rf ~/toolchain
        df -h
        echo "Workspace cleaned"

    - name: Setup Build Environment
      run: |
        echo "=== Installing dependencies for Android ${{ github.event.inputs.ANDROID_VERSION }} ==="
        
        sudo apt-get update
        
        # Install base build dependencies
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex g++-multilib \
          gcc-multilib git gnupg gperf imagemagick \
          liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool \
          squashfs-tools xsltproc zip zlib1g-dev python3 \
          python-is-python3 perl libelf-dev cpio
        
        # Install additional dependencies
        sudo apt-get install -y \
          lib32z1-dev lib32readline-dev \
          libc6-dev-i386 libx11-dev lib32z-dev \
          libgl1-mesa-dev xsltproc unzip fontconfig
        
        # Install older OpenSSL for compatibility
        sudo apt-get install -y libssl1.1 || true

    - name: Setup Toolchain for Extended Kernel
      run: |
        echo "=== Setting up Toolchain ==="
        
        mkdir -p ~/toolchain
        cd ~/toolchain
        
        # Use Proton Clang
        echo "Downloading Proton Clang..."
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
        
        # Get GCC for cross compile
        echo "Downloading GCC toolchains..."
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
        
        # Verify toolchain
        ls -la ~/toolchain/
        echo "Clang version: $(~/toolchain/clang/bin/clang --version | head -1)"

    - name: Clone Extended Kernel Source
      run: |
        echo "=== Cloning Extended kernel source ==="
        
        if [ -d "kernel" ]; then
          rm -rf kernel
        fi
        
        git clone --depth=1 https://github.com/fernandobouchet/Whyred -b extended kernel
        
        if [ ! -d "kernel" ]; then
          echo "Failed to clone kernel!"
          exit 1
        fi
        
        cd kernel
        echo "Kernel commit: $(git rev-parse HEAD)"
        echo "Kernel version: $(make kernelversion 2>/dev/null || echo 'Unknown')"

    - name: Apply Android 14 Compatibility Patches
      run: |
        cd kernel
        
        echo "=== Applying Android 14 compatibility patches ==="
        
        if [ ! -f "arch/arm64/configs/whyred_defconfig" ]; then
          echo "Error: whyred_defconfig not found!"
          ls -la arch/arm64/configs/
          exit 1
        fi
        
        # Patch kernel config for Android 14
        cat >> arch/arm64/configs/whyred_defconfig << 'EOL'
        
        # Android 14 Requirements
        CONFIG_ANDROID_KABI_RESERVE=y
        CONFIG_ANDROID_VENDOR_HOOKS=y
        CONFIG_EXT4_FS_POSIX_ACL=y
        CONFIG_F2FS_FS_POSIX_ACL=y
        CONFIG_BPF_JIT=y
        CONFIG_USERFAULTFD=y
        CONFIG_UNICODE=y
        
        # Security for Android 14
        CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y
        CONFIG_INIT_ON_FREE_DEFAULT_ON=y
        CONFIG_HARDENED_USERCOPY=y
        CONFIG_HARDENED_USERCOPY_FALLBACK=y
        CONFIG_FORTIFY_SOURCE=y
        CONFIG_SECURITY_SELINUX_DEVELOP=y
        
        # Extended kernel specific
        CONFIG_EXTENDED_KERNEL=y
        CONFIG_EXTENDED_MODULES=y
        EOL
        
        # Fix build issues
        if [ -f "scripts/gcc-version.sh" ]; then
          sed -i 's/\$compiler -dumpversion/\$compiler -dumpfullversion/g' scripts/gcc-version.sh
        fi

    - name: Setup KernelSU with Kernel 4.4 Compatibility
      run: |
        cd kernel
        
        echo "=== Integrating KernelSU for Kernel 4.4 ==="
        
        # Remove any existing KernelSU
        rm -rf KernelSU
        rm -rf drivers/kernelsu
        
        # Setup KernelSU
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s ${{ github.event.inputs.KSU_VERSION || 'main' }}
        
        # Fix KernelSU for kernel 4.4 compatibility
        echo "=== Patching KernelSU for kernel 4.4 compatibility ==="
        
        # Fix MODULE_IMPORT_NS issue
        if [ -f "drivers/kernelsu/ksu.c" ]; then
          echo "Patching ksu.c for kernel 4.4..."
          
          # Remove or comment out MODULE_IMPORT_NS line
          sed -i '/MODULE_IMPORT_NS/d' drivers/kernelsu/ksu.c
          
          # Alternative: Comment it out
          # sed -i 's/^MODULE_IMPORT_NS/\/\/ MODULE_IMPORT_NS/' drivers/kernelsu/ksu.c
          
          # Add compatibility defines if needed
          cat > drivers/kernelsu/compat.h << 'EOF'
        #ifndef _KSU_COMPAT_H
        #define _KSU_COMPAT_H
        
        /* Compatibility for older kernels */
        #ifndef MODULE_IMPORT_NS
        #define MODULE_IMPORT_NS(ns) 
        #endif
        
        #endif /* _KSU_COMPAT_H */
        EOF
          
          # Include compat header in ksu.c
          sed -i '1i#include "compat.h"' drivers/kernelsu/ksu.c
        fi
        
        # Fix other potential compatibility issues
        if [ -d "KernelSU" ]; then
          echo "Applying additional KernelSU patches..."
          
          # Fix for older kernel headers
          find KernelSU -name "*.c" -o -name "*.h" | while read file; do
            # Remove MODULE_IMPORT_NS references
            sed -i '/MODULE_IMPORT_NS/d' "$file" 2>/dev/null || true
            
            # Fix other potential issues
            sed -i 's/struct user_namespace \*mnt_userns/struct user_namespace \*ns/g' "$file" 2>/dev/null || true
          done
        fi
        
        # Verify KSU integration
        if [ -d "KernelSU" ] || [ -d "drivers/kernelsu" ]; then
          echo "✓ KernelSU integrated"
          if [ -d "KernelSU" ]; then
            cd KernelSU && git log --oneline -1 && cd ..
          fi
        else
          echo "Warning: KernelSU directory not found!"
        fi

    - name: Configure Kernel for HyperOS 2
      run: |
        cd kernel
        
        # Setup environment
        export PATH="$HOME/toolchain/clang/bin:$HOME/toolchain/gcc64/bin:$HOME/toolchain/gcc32/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="KSU-Extended"
        export KBUILD_BUILD_HOST="HyperOS2"
        
        # Clean if requested
        if [ "${{ github.event.inputs.CLEAN_BUILD }}" = "true" ]; then
          echo "Performing clean build..."
          rm -rf out
          make clean || true
          make mrproper || true
        fi
        
        # Create out directory
        mkdir -p out
        
        # Load Extended defconfig
        make O=out ARCH=arm64 whyred_defconfig
        
        # Enable KernelSU if config tool exists
        if [ -f "scripts/config" ]; then
          scripts/config --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_OVERLAY_FS \
            --enable CONFIG_MODULES \
            --enable CONFIG_MODULE_UNLOAD \
            --enable CONFIG_MODULE_FORCE_UNLOAD || true
          
          # Android 14 specific configs
          if [ "${{ github.event.inputs.ANDROID_VERSION }}" = "14" ]; then
            scripts/config --file out/.config \
              --enable CONFIG_ANDROID_BINDERFS \
              --enable CONFIG_ANDROID_BINDER_IPC \
              --set-str CONFIG_ANDROID_BINDER_DEVICES "binder,hwbinder,vndbinder" || true
          fi
        else
          echo "Warning: scripts/config not found, manually editing .config"
          
          # Manually add KernelSU config
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_OVERLAY_FS=y" >> out/.config
          echo "CONFIG_MODULES=y" >> out/.config
        fi
        
        # Regenerate config
        make O=out ARCH=arm64 olddefconfig

    - name: Build Extended Kernel with KSU
      run: |
        cd kernel
        
        # Setup environment
        export PATH="$HOME/toolchain/clang/bin:$HOME/toolchain/gcc64/bin:$HOME/toolchain/gcc32/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="KSU-Extended"
        export KBUILD_BUILD_HOST="HyperOS2"
        
        # Suppress OpenSSL warnings
        export CFLAGS="-Wno-deprecated-declarations"
        
        # Build info
        echo "=== Build Information ==="
        echo "Clang version: $(clang --version | head -1)"
        echo "Building for Android: ${{ github.event.inputs.ANDROID_VERSION }}"
        echo "KernelSU: ${{ github.event.inputs.KSU_VERSION }}"
        echo "CPU cores: $(nproc)"
        
        START=$(date +"%s")
        
        # Build kernel - capture both success and failure
        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          2>&1 | tee build.log || BUILD_RESULT=$?
        
        END=$(date +"%s")
        DIFF=$((END - START))
        echo "Build time: $((DIFF / 60))m $((DIFF % 60))s"
        
        # Check if kernel was built despite errors
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "✓ Kernel image found!"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          exit 0
        else
          echo "✗ Build failed - checking for partial build..."
          
          # Check for Image.gz (without dtb)
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "Found Image.gz, creating Image.gz-dtb..."
            cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/qcom/*.dtb > out/arch/arm64/boot/Image.gz-dtb 2>/dev/null || true
            
            if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
              echo "✓ Created Image.gz-dtb successfully!"
              exit 0
            fi
          fi
          
          echo "✗ Build completely failed"
          echo "Last 100 lines of build log:"
          tail -100 build.log
          exit 1
        fi

    - name: Verify Build
      run: |
        cd kernel
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "✓ Kernel built successfully!"
          echo "Kernel info:"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          file out/arch/arm64/boot/Image.gz-dtb
          strings out/arch/arm64/boot/Image.gz-dtb | grep -i "linux version" | head -1 || true
        else
          echo "✗ Build failed - kernel image not found!"
          echo "Contents of out/arch/arm64/boot/:"
          ls -la out/arch/arm64/boot/ || echo "Directory not found"
          exit 1
        fi

    - name: Create AnyKernel3 Package
      run: |
        echo "=== Creating flashable zip ==="
        
        rm -rf AnyKernel3
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cd AnyKernel3
        
        rm -rf .git* README.md LICENSE
        
        # Configure for whyred
        cat > anykernel.sh << 'EOL'
        # AnyKernel3 Ramdisk Mod Script
        properties() { '
        kernel.string=KernelSU Next Extended for HyperOS 2 (whyred)
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=whyred
        device.name2=Redmi Note 5
        device.name3=Redmi Note 5 Pro
        supported.versions=14
        '; }
        
        block=/dev/block/bootdevice/by-name/boot;
        is_slot_device=0;
        ramdisk_compression=auto;
        patch_vbmeta_flag=auto;
        
        . tools/ak3-core.sh;
        
        set_perm_recursive 0 0 755 644 $ramdisk/*;
        set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;
        
        dump_boot;
        write_boot;
        EOL
        
        # Copy kernel
        cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
        
        # Create flashable zip
        ZIP_NAME="KSU-Extended-HyperOS2-A${{ github.event.inputs.ANDROID_VERSION }}-$(date +%Y%m%d-%H%M).zip"
        zip -r9 "../$ZIP_NAME" * -x '*.git*'
        
        cd ..
        echo "✓ Flashable zip created: $ZIP_NAME"
        ls -lh *.zip

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Extended-Kernel-Image
        path: kernel/out/arch/arm64/boot/Image.gz-dtb
        compression-level: 9
        retention-days: 30
        if-no-files-found: error

    - name: Upload Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        name: KSU-Extended-Flashable-Zip
        path: KSU-Extended-*.zip
        compression-level: 9
        retention-days: 30
        if-no-files-found: error

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log
        path: kernel/build.log
        compression-level: 9
        retention-days: 7
        if-no-files-found: ignore

    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: KSU-Extended-A${{ github.event.inputs.ANDROID_VERSION }}-${{ github.run_number }}
        name: KernelSU Extended HyperOS 2 - Build ${{ github.run_number }}
        body: |
          ## KernelSU Extended for HyperOS 2
          ### Xiaomi Redmi Note 5 (whyred)
          
          - **Android Version:** ${{ github.event.inputs.ANDROID_VERSION }}
          - **KernelSU Version:** ${{ github.event.inputs.KSU_VERSION }}
          - **Kernel Base:** 4.4.302-Extended
          
          ### Installation:
          1. Backup boot.img
          2. Flash via custom recovery
          3. Install KernelSU Manager APK
          
          ⚠️ **For HyperOS 2 Android 14 only!**
        files: |
          KSU-Extended-*.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build KernelSU for Non-GKI Whyred Kernel

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel Source'
        required: true
        default: 'extended'
        type: choice
        options:
        - extended
        - lineageos
        - aosp
      ANDROID_VERSION:
        description: 'Android Version'
        required: true
        default: '14'
        type: choice
        options:
        - '14'
        - '13'
        - '12'
      KSU_METHOD:
        description: 'KernelSU Integration Method'
        required: true
        default: 'manual'
        type: choice
        options:
        - manual
        - module
        - builtin
      CLEAN_BUILD:
        description: 'Clean Build'
        required: true
        default: true
        type: boolean

env:
  TZ: Asia/Jakarta
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    
    permissions:
      contents: write
      packages: write
      actions: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean Workspace
      run: |
        echo "=== Cleaning workspace ==="
        rm -rf kernel
        rm -rf ~/toolchain
        df -h

    - name: Setup Build Environment
      run: |
        echo "=== Installing dependencies ==="
        
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex g++-multilib \
          gcc-multilib git gnupg gperf imagemagick \
          liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool \
          squashfs-tools xsltproc zip zlib1g-dev python3 \
          python-is-python3 perl libelf-dev cpio \
          lib32z1-dev lib32readline-dev libc6-dev-i386 \
          patch wget

    - name: Setup Toolchain
      run: |
        echo "=== Setting up Toolchain ==="
        
        mkdir -p ~/toolchain
        cd ~/toolchain
        
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
        
        echo "Toolchain ready"

    - name: Clone Kernel Source
      run: |
        echo "=== Cloning kernel source ==="
        
        case "${{ github.event.inputs.KERNEL_SOURCE }}" in
          extended)
            git clone --depth=1 https://github.com/fernandobouchet/Whyred -b extended kernel
            ;;
          lineageos)
            git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_sdm660 -b lineage-20 kernel
            ;;
          aosp)
            git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource -b whyred-q-oss kernel
            ;;
        esac
        
        cd kernel
        KERNEL_VERSION=$(make kernelversion 2>/dev/null || echo "4.4.x")
        echo "Kernel version: $KERNEL_VERSION"
        echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV

    - name: Manual Integration of KernelSU for Non-GKI
      run: |
        cd kernel
        
        echo "=== Integrating KernelSU for Non-GKI Kernel ==="
        
        # Download KernelSU source
        git clone https://github.com/tiann/KernelSU
        cd KernelSU
        KERNELSU_COMMIT=$(git rev-parse HEAD)
        echo "KernelSU commit: $KERNELSU_COMMIT"
        cd ..
        
        # Create KernelSU directory
        mkdir -p drivers/kernelsu
        
        # Copy core KernelSU files
        cp -r KernelSU/kernel/* drivers/kernelsu/ 2>/dev/null || true
        
        # Create Kconfig (FIXED: Using printf instead of cat with heredoc)
        printf '%s\n' \
          'config KSU' \
          '    tristate "KernelSU function support"' \
          '    depends on OVERLAY_FS' \
          '    default y' \
          '    help' \
          '      Enable kernel-level root solution.' \
          '      To compile as module, choose M.' \
          '      To compile into kernel, choose Y.' \
          '      If unsure, say Y.' \
          '' \
          'config KSU_DEBUG' \
          '    bool "KernelSU debug mode"' \
          '    depends on KSU' \
          '    default n' \
          '    help' \
          '      Enable KernelSU debug mode.' \
          > drivers/kernelsu/Kconfig
        
        # Create Makefile
        printf '%s\n' \
          '# KernelSU Makefile for non-GKI kernels' \
          'obj-$(CONFIG_KSU) += ksu.o' \
          '' \
          'ksu-y := core.o' \
          'ksu-y += allowlist.o' \
          'ksu-y += apk_sign.o' \
          'ksu-y += sucompat.o' \
          'ksu-y += kernel_compat.o' \
          'ksu-y += selinux/selinux.o' \
          '' \
          '# For kernel 4.4 compatibility' \
          'ccflags-y := -I$(srctree)/security/selinux/include' \
          'ccflags-y += -I$(srctree)/include' \
          'ccflags-y += -DKSU_VERSION=\"12126\"' \
          'ccflags-y += -DCONFIG_KPROBES' \
          'ccflags-y += -Wno-implicit-function-declaration' \
          'ccflags-y += -Wno-unused-function' \
          'ccflags-y += -Wno-unused-variable' \
          > drivers/kernelsu/Makefile
        
        # Add to drivers/Makefile
        if ! grep -q "kernelsu" drivers/Makefile; then
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          echo "✓ Added KernelSU to drivers/Makefile"
        fi
        
        # Add to drivers/Kconfig
        if ! grep -q "kernelsu" drivers/Kconfig; then
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo "✓ Added KernelSU to drivers/Kconfig"
        fi
        
        # Create kernel_compat.c
        printf '%s\n' \
          '/* KernelSU compatibility layer for kernel 4.4 */' \
          '#include <linux/version.h>' \
          '#include <linux/module.h>' \
          '#include <linux/kernel.h>' \
          '' \
          '#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 10, 0)' \
          '' \
          '#include <linux/uaccess.h>' \
          '#include <linux/fs.h>' \
          '' \
          '#ifndef MODULE_IMPORT_NS' \
          '#define MODULE_IMPORT_NS(ns)' \
          '#endif' \
          '' \
          '#ifndef CONFIG_KPROBES' \
          '#warning "KPROBES not supported, some features may not work"' \
          '#endif' \
          '' \
          '#endif /* Kernel version check */' \
          '' \
          'MODULE_LICENSE("GPL");' \
          'MODULE_DESCRIPTION("KernelSU Compatibility Layer");' \
          > drivers/kernelsu/kernel_compat.c
        
        # Fix compatibility issues
        find drivers/kernelsu -name "*.c" | while read file; do
          sed -i '/MODULE_IMPORT_NS/d' "$file"
          sed -i 's/mnt_userns/user_ns/g' "$file" 2>/dev/null || true
          sed -i '1i#include <linux/version.h>' "$file" 2>/dev/null || true
        done
        
        # Patch core.c
        if [ -f "drivers/kernelsu/core.c" ]; then
          sed -i '1i\
        #include <linux/version.h>\
        #include <linux/module.h>\
        #include <linux/kernel.h>\
        #ifndef MODULE_IMPORT_NS\
        #define MODULE_IMPORT_NS(x)\
        #endif' drivers/kernelsu/core.c
        fi
        
        echo "✓ KernelSU manual integration complete"

    - name: Configure Kernel Defconfig for KernelSU
      run: |
        cd kernel
        
        echo "=== Configuring kernel for KernelSU ==="
        
        DEFCONFIG=$(find arch -name "*whyred*defconfig" | head -1)
        
        if [ -z "$DEFCONFIG" ]; then
          DEFCONFIG="arch/arm64/configs/whyred_defconfig"
        fi
        
        echo "Using defconfig: $DEFCONFIG"
        
        # Add KernelSU configs using printf
        printf '%s\n' \
          '' \
          '# KernelSU Support (Non-GKI)' \
          'CONFIG_KSU=y' \
          'CONFIG_OVERLAY_FS=y' \
          'CONFIG_OVERLAY_FS_REDIRECT_DIR=y' \
          'CONFIG_OVERLAY_FS_INDEX=y' \
          '' \
          '# Required for KernelSU' \
          'CONFIG_KPROBES=y' \
          'CONFIG_HAVE_KPROBES=y' \
          'CONFIG_KPROBE_EVENTS=y' \
          'CONFIG_MODULES=y' \
          'CONFIG_MODULE_UNLOAD=y' \
          'CONFIG_MODULE_FORCE_UNLOAD=y' \
          '' \
          '# Security features' \
          'CONFIG_SECURITY=y' \
          'CONFIG_SECURITYFS=y' \
          'CONFIG_SECURITY_SELINUX=y' \
          '' \
          '# Android binder' \
          'CONFIG_ANDROID=y' \
          'CONFIG_ANDROID_BINDER_IPC=y' \
          'CONFIG_ANDROID_BINDERFS=n' \
          'CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"' \
          '' \
          '# File systems' \
          'CONFIG_EXT4_FS=y' \
          'CONFIG_F2FS_FS=y' \
          >> "$DEFCONFIG"
        
        echo "✓ Defconfig updated"

    - name: Build Configuration
      run: |
        cd kernel
        
        export PATH="$HOME/toolchain/clang/bin:$HOME/toolchain/gcc64/bin:$HOME/toolchain/gcc32/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="KernelSU"
        export KBUILD_BUILD_HOST="Builder"
        
        if [ "${{ github.event.inputs.CLEAN_BUILD }}" = "true" ]; then
          rm -rf out
          make mrproper
          make clean
        fi
        
        mkdir -p out
        make O=out ARCH=arm64 whyred_defconfig
        
        # Verify KSU config
        grep "CONFIG_KSU" out/.config || {
          echo "CONFIG_KSU=y" >> out/.config
          echo "Added CONFIG_KSU=y manually"
        }
        
        make O=out ARCH=arm64 olddefconfig
        
        echo "=== KernelSU Configuration Status ==="
        grep -E "KSU|OVERLAY_FS|KPROBES" out/.config

    - name: Compile Kernel with KernelSU
      run: |
        cd kernel
        
        export PATH="$HOME/toolchain/clang/bin:$HOME/toolchain/gcc64/bin:$HOME/toolchain/gcc32/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="KernelSU"
        export KBUILD_BUILD_HOST="NonGKI"
        export KCFLAGS="-w -Wno-error"
        export KAFLAGS="-w"
        
        echo "=== Building Kernel with KernelSU ==="
        
        START=$(date +"%s")
        
        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          V=0 \
          2>&1 | tee build.log || BUILD_STATUS=$?
        
        END=$(date +"%s")
        DIFF=$((END - START))
        echo "Build time: $((DIFF / 60))m $((DIFF % 60))s"
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "✅ Build successful!"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
        elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
          echo "Creating Image.gz-dtb..."
          cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/qcom/*.dtb > out/arch/arm64/boot/Image.gz-dtb 2>/dev/null || \
          cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/*.dtb > out/arch/arm64/boot/Image.gz-dtb 2>/dev/null || true
          
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "✅ Created Image.gz-dtb!"
          fi
        else
          echo "❌ Build failed"
          grep -i "error" build.log | tail -50
          exit 1
        fi

    - name: Create AnyKernel3 Package
      run: |
        echo "=== Creating flashable zip ==="
        
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cd AnyKernel3
        rm -rf .git* README.md LICENSE
        
        # Create anykernel.sh using printf
        printf '%s\n' \
          '# AnyKernel3 Ramdisk Mod Script' \
          '# For Whyred with KernelSU (Non-GKI)' \
          '' \
          'properties() { '\'''\' \
          'kernel.string=KernelSU Non-GKI Kernel for Whyred' \
          'do.devicecheck=1' \
          'do.modules=0' \
          'do.systemless=1' \
          'do.cleanup=1' \
          'do.cleanuponabort=0' \
          'device.name1=whyred' \
          'device.name2=Redmi Note 5' \
          'device.name3=Redmi Note 5 Pro' \
          'supported.versions=${{ github.event.inputs.ANDROID_VERSION }}' \
          'supported.patchlevels=' \
          '\''; }' \
          '' \
          'block=/dev/block/bootdevice/by-name/boot;' \
          'is_slot_device=0;' \
          'ramdisk_compression=auto;' \
          'patch_vbmeta_flag=auto;' \
          '' \
          '. tools/ak3-core.sh;' \
          '' \
          'set_perm_recursive 0 0 755 644 $ramdisk/*;' \
          'set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;' \
          '' \
          'dump_boot;' \
          'write_boot;' \
          > anykernel.sh
        
        cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
        
        mkdir -p modules
        
        # Create version info
        printf '%s\n' \
          'KernelSU Non-GKI Build' \
          '======================' \
          "Build Date: $(date)" \
          "Kernel Source: ${{ github.event.inputs.KERNEL_SOURCE }}" \
          "Android Version: ${{ github.event.inputs.ANDROID_VERSION }}" \
          "Integration Method: ${{ github.event.inputs.KSU_METHOD }}" \
          "Device: Xiaomi Redmi Note 5 (whyred)" \
          > version.txt
        
        ZIP_NAME="KernelSU-NonGKI-${{ github.event.inputs.KERNEL_SOURCE }}-A${{ github.event.inputs.ANDROID_VERSION }}-$(date +%Y%m%d-%H%M).zip"
        zip -r9 "../$ZIP_NAME" * -x '*.git*'
        
        cd ..
        echo "✅ Created: $ZIP_NAME"
        ls -lh *.zip

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-NonGKI-Image
        path: kernel/out/arch/arm64/boot/Image.gz-dtb
        compression-level: 9
        retention-days: 30
        if-no-files-found: error

    - name: Upload Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-NonGKI-Flashable
        path: KernelSU-NonGKI-*.zip
        compression-level: 9
        retention-days: 30
        if-no-files-found: error

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log
        path: kernel/build.log
        compression-level: 9
        retention-days: 7
        if-no-files-found: ignore

    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: KSU-NonGKI-${{ github.event.inputs.KERNEL_SOURCE }}-${{ github.run_number }}
        name: KernelSU Non-GKI Build ${{ github.run_number }}
        body: |
          ## KernelSU for Non-GKI Kernel (Whyred)
          
          - **Device:** Xiaomi Redmi Note 5 (whyred)
          - **Kernel:** ${{ github.event.inputs.KERNEL_SOURCE }}
          - **Android:** ${{ github.event.inputs.ANDROID_VERSION }}
          - **Method:** ${{ github.event.inputs.KSU_METHOD }}
          
          ### Installation:
          1. Backup boot.img
          2. Flash via recovery
          3. Install KernelSU Manager
          
          ⚠️ **Only for Android ${{ github.event.inputs.ANDROID_VERSION }}**
        files: |
          KernelSU-NonGKI-*.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

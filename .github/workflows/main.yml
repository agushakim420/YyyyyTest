name: Build KernelSU Next Extended for HyperOS 2

on:
  workflow_dispatch:
    inputs:
      ANDROID_VERSION:
        description: 'Android Version'
        required: true
        default: '14'
        type: choice
        options:
        - '14'
        - '13'
      KSU_VERSION:
        description: 'KernelSU Version'
        required: true
        default: 'main'
        type: choice
        options:
        - main
        - next
      CLEAN_BUILD:
        description: 'Clean Build'
        required: true
        default: true
        type: boolean

env:
  TZ: Asia/Jakarta
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    
    permissions:
      contents: write
      packages: write
      actions: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean Workspace
      run: |
        echo "=== Cleaning workspace ==="
        rm -rf kernel
        rm -rf ~/toolchain
        df -h
        echo "Workspace cleaned"

    - name: Setup Build Environment
      run: |
        echo "=== Installing dependencies for Android ${{ github.event.inputs.ANDROID_VERSION }} ==="
        
        sudo apt-get update
        
        # Install base build dependencies
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex g++-multilib \
          gcc-multilib git gnupg gperf imagemagick \
          liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool \
          squashfs-tools xsltproc zip zlib1g-dev python3 \
          python-is-python3 perl libelf-dev cpio
        
        # Install additional dependencies
        sudo apt-get install -y \
          lib32z1-dev lib32readline-dev \
          libc6-dev-i386 libx11-dev lib32z-dev \
          libgl1-mesa-dev xsltproc unzip fontconfig

    - name: Setup Toolchain for Extended Kernel
      run: |
        echo "=== Setting up Toolchain ==="
        
        mkdir -p ~/toolchain
        cd ~/toolchain
        
        # Use Proton Clang
        echo "Downloading Proton Clang..."
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
        
        # Get GCC for cross compile
        echo "Downloading GCC toolchains..."
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
        
        # Verify toolchain
        ls -la ~/toolchain/
        echo "Clang version: $(~/toolchain/clang/bin/clang --version | head -1)"

    - name: Clone Extended Kernel Source
      run: |
        echo "=== Cloning Extended kernel source ==="
        
        if [ -d "kernel" ]; then
          rm -rf kernel
        fi
        
        git clone --depth=1 https://github.com/fernandobouchet/Whyred -b extended kernel
        
        if [ ! -d "kernel" ]; then
          echo "Failed to clone kernel!"
          exit 1
        fi
        
        cd kernel
        echo "Kernel commit: $(git rev-parse HEAD)"
        echo "Kernel version: $(make kernelversion 2>/dev/null || echo 'Unknown')"

    - name: Apply Android 14 and KernelSU Required Patches
      run: |
        cd kernel
        
        echo "=== Applying Android 14 and KernelSU compatibility patches ==="
        
        if [ ! -f "arch/arm64/configs/whyred_defconfig" ]; then
          echo "Error: whyred_defconfig not found!"
          ls -la arch/arm64/configs/
          exit 1
        fi
        
        # Patch kernel config for Android 14 and KernelSU requirements
        cat >> arch/arm64/configs/whyred_defconfig << 'EOL'
        
        # Android 14 Requirements
        CONFIG_ANDROID_KABI_RESERVE=y
        CONFIG_ANDROID_VENDOR_HOOKS=y
        CONFIG_EXT4_FS_POSIX_ACL=y
        CONFIG_F2FS_FS_POSIX_ACL=y
        CONFIG_BPF_JIT=y
        CONFIG_USERFAULTFD=y
        CONFIG_UNICODE=y
        
        # Security for Android 14
        CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y
        CONFIG_INIT_ON_FREE_DEFAULT_ON=y
        CONFIG_HARDENED_USERCOPY=y
        CONFIG_HARDENED_USERCOPY_FALLBACK=y
        CONFIG_FORTIFY_SOURCE=y
        CONFIG_SECURITY_SELINUX_DEVELOP=y
        
        # KernelSU Requirements (CRITICAL!)
        CONFIG_KPROBES=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_MODULES=y
        CONFIG_MODULE_UNLOAD=y
        CONFIG_MODULE_FORCE_UNLOAD=y
        CONFIG_OVERLAY_FS=y
        
        # Extended kernel specific
        CONFIG_EXTENDED_KERNEL=y
        CONFIG_EXTENDED_MODULES=y
        EOL
        
        # Fix build issues
        if [ -f "scripts/gcc-version.sh" ]; then
          sed -i 's/\$compiler -dumpversion/\$compiler -dumpfullversion/g' scripts/gcc-version.sh
        fi

    - name: Setup KernelSU with Complete Compatibility Layer
      run: |
        cd kernel
        
        echo "=== Integrating KernelSU with full compatibility ==="
        
        # Remove any existing KernelSU
        rm -rf KernelSU
        rm -rf drivers/kernelsu
        
        # Setup KernelSU
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s ${{ github.event.inputs.KSU_VERSION || 'main' }}
        
        echo "=== Creating comprehensive compatibility layer for kernel 4.4 ==="
        
        # Create complete compat.h file
        if [ -d "drivers/kernelsu" ]; then
          cat > drivers/kernelsu/compat.h << 'EOF'
        #ifndef _KSU_COMPAT_H
        #define _KSU_COMPAT_H
        
        #include <linux/version.h>
        #include <linux/types.h>
        #include <linux/string.h>
        
        /* MODULE_IMPORT_NS doesn't exist in kernel 4.4 */
        #ifndef MODULE_IMPORT_NS
        #define MODULE_IMPORT_NS(ns)
        #endif
        
        /* Kernel 4.4 compatibility definitions */
        #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 14, 0)
        #define ksu_strncpy_from_user strncpy_from_user
        #else
        #define ksu_strncpy_from_user strncpy_from_user_nofault
        #endif
        
        #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 11, 0)
        #define ksu_get_user_pages(start, nr_pages, write, pages) \
            get_user_pages(current, current->mm, start, nr_pages, \
                          write ? FOLL_WRITE : 0, 0, pages, NULL)
        #else
        #define ksu_get_user_pages(start, nr_pages, write, pages) \
            get_user_pages(start, nr_pages, write ? FOLL_WRITE : 0, pages, NULL)
        #endif
        
        #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 8, 0)
        #define ksu_proc_mkdir(name, parent) proc_mkdir(name, parent)
        #define ksu_proc_create_data(name, mode, parent, fops, data) \
            proc_create_data(name, mode, parent, fops, data)
        #else  
        #define ksu_proc_mkdir(name, parent) proc_mkdir(name, parent)
        #define ksu_proc_create_data(name, mode, parent, fops, data) \
            proc_create_data(name, mode, parent, fops, data)
        #endif
        
        /* VFS compatibility for kernel 4.4 */
        #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 12, 0)
        #define kernel_read(file, buf, count, pos) \
            kernel_read(file, *(pos), buf, count)
        #define kernel_write(file, buf, count, pos) \
            kernel_write(file, buf, count, *(pos))
        #endif
        
        /* User namespace compatibility */
        #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 12, 0)
        struct user_namespace;
        #define mnt_userns init_user_ns
        #endif
        
        /* Additional compatibility for KernelSU */
        #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 0, 0)
        #define ksu_task_uid(task) (task)->cred->uid
        #define ksu_task_euid(task) (task)->cred->euid
        #else
        #define ksu_task_uid(task) (task)->cred->uid
        #define ksu_task_euid(task) (task)->cred->euid
        #endif
        
        /* Memory management compatibility */
        #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 6, 0)
        #define ksu_kvmalloc(size, flags) kmalloc(size, flags)
        #define ksu_kvfree(ptr) kfree(ptr)
        #else
        #define ksu_kvmalloc(size, flags) kvmalloc(size, flags)
        #define ksu_kvfree(ptr) kvfree(ptr)
        #endif
        
        #endif /* _KSU_COMPAT_H */
        EOF
          
          echo "✓ Created comprehensive compat.h"
        fi
        
        # Fix ksu.c to include compat.h and remove problematic lines
        if [ -f "drivers/kernelsu/ksu.c" ]; then
          echo "Patching ksu.c..."
          
          # Remove MODULE_IMPORT_NS line
          sed -i '/MODULE_IMPORT_NS/d' drivers/kernelsu/ksu.c
          
          # Add compat.h include at the beginning of the file
          sed -i '1i#include "compat.h"' drivers/kernelsu/ksu.c
          
          echo "✓ Patched ksu.c"
        fi
        
        # Fix other KernelSU files for compatibility
        if [ -d "KernelSU" ]; then
          echo "Applying additional KernelSU patches..."
          
          # Find and fix all MODULE_IMPORT_NS references
          find KernelSU drivers/kernelsu -name "*.c" -o -name "*.h" 2>/dev/null | while read file; do
            if [ -f "$file" ]; then
              # Remove MODULE_IMPORT_NS
              sed -i '/MODULE_IMPORT_NS/d' "$file" 2>/dev/null || true
              
              # Fix other kernel 4.4 incompatibilities
              sed -i 's/struct user_namespace \*mnt_userns/struct user_namespace \*ns/g' "$file" 2>/dev/null || true
            fi
          done
          
          echo "✓ Fixed all KernelSU files"
        fi
        
        # Verify KSU integration
        if [ -d "KernelSU" ] || [ -d "drivers/kernelsu" ]; then
          echo "✓ KernelSU integrated successfully"
          if [ -d "KernelSU" ]; then
            cd KernelSU && git log --oneline -1 && cd ..
          fi
        else
          echo "Warning: KernelSU directory not found!"
        fi

    - name: Configure Kernel with KernelSU Support
      run: |
        cd kernel
        
        # Setup environment
        export PATH="$HOME/toolchain/clang/bin:$HOME/toolchain/gcc64/bin:$HOME/toolchain/gcc32/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="KSU-Extended"
        export KBUILD_BUILD_HOST="HyperOS2"
        
        # Clean if requested
        if [ "${{ github.event.inputs.CLEAN_BUILD }}" = "true" ]; then
          echo "Performing clean build..."
          rm -rf out
          make clean || true
          make mrproper || true
        fi
        
        # Create out directory
        mkdir -p out
        
        # Load Extended defconfig
        make O=out ARCH=arm64 whyred_defconfig
        
        # Enable KernelSU and required features
        echo "Enabling KernelSU configuration..."
        
        # Create config fragment for KernelSU
        cat > out/ksu.config << 'EOL'
        CONFIG_KSU=y
        CONFIG_KPROBES=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_OVERLAY_FS=y
        CONFIG_MODULES=y
        CONFIG_MODULE_UNLOAD=y
        CONFIG_MODULE_FORCE_UNLOAD=y
        EOL
        
        # Merge config
        ./scripts/kconfig/merge_config.sh -O out out/.config out/ksu.config 2>/dev/null || {
          echo "merge_config.sh not found, manually adding configs..."
          cat out/ksu.config >> out/.config
        }
        
        # Android 14 specific configs
        if [ "${{ github.event.inputs.ANDROID_VERSION }}" = "14" ]; then
          echo "CONFIG_ANDROID_BINDERFS=y" >> out/.config
          echo "CONFIG_ANDROID_BINDER_IPC=y" >> out/.config
        fi
        
        # Regenerate config
        make O=out ARCH=arm64 olddefconfig
        
        # Verify KSU config is enabled
        echo "Verifying KernelSU configuration..."
        grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_OVERLAY_FS" out/.config || echo "Warning: Some KSU configs might be missing"

    - name: Build Extended Kernel with KernelSU
      run: |
        cd kernel
        
        # Setup environment
        export PATH="$HOME/toolchain/clang/bin:$HOME/toolchain/gcc64/bin:$HOME/toolchain/gcc32/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="KSU-Extended"
        export KBUILD_BUILD_HOST="HyperOS2"
        
        # Suppress warnings
        export KCFLAGS="-w"
        export KAFLAGS="-w"
        
        # Build info
        echo "=== Build Information ==="
        echo "Clang version: $(clang --version | head -1)"
        echo "Building for Android: ${{ github.event.inputs.ANDROID_VERSION }}"
        echo "KernelSU: ${{ github.event.inputs.KSU_VERSION }}"
        echo "CPU cores: $(nproc)"
        
        START=$(date +"%s")
        
        # Build kernel
        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          2>&1 | tee build.log || BUILD_RESULT=$?
        
        END=$(date +"%s")
        DIFF=$((END - START))
        echo "Build time: $((DIFF / 60))m $((DIFF % 60))s"
        
        # Check build result
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "✓ Kernel image found!"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          exit 0
        elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
          echo "Image.gz found, creating Image.gz-dtb..."
          
          # Find and append DTB
          if [ -d "out/arch/arm64/boot/dts/qcom" ]; then
            cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/qcom/*.dtb > out/arch/arm64/boot/Image.gz-dtb 2>/dev/null || {
              echo "Failed to append DTB"
              cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/*.dtb > out/arch/arm64/boot/Image.gz-dtb 2>/dev/null || true
            }
          fi
          
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "✓ Created Image.gz-dtb successfully!"
            ls -lh out/arch/arm64/boot/Image.gz-dtb
            exit 0
          fi
        fi
        
        echo "✗ Build failed"
        echo "Last 100 lines of build log:"
        tail -100 build.log
        exit 1

    - name: Verify Build and KernelSU Integration
      run: |
        cd kernel
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "✓ Kernel built successfully!"
          echo "Kernel info:"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          file out/arch/arm64/boot/Image.gz-dtb
          
          # Check for KernelSU in kernel
          if strings out/arch/arm64/boot/Image.gz-dtb | grep -q "KernelSU"; then
            echo "✓ KernelSU detected in kernel image!"
          else
            echo "⚠️ Warning: KernelSU string not found in kernel (might be normal)"
          fi
          
          # Check kernel version
          strings out/arch/arm64/boot/Image.gz-dtb | grep -i "linux version" | head -1 || true
        else
          echo "✗ Kernel image not found!"
          exit 1
        fi

    - name: Create AnyKernel3 Package
      run: |
        echo "=== Creating flashable zip ==="
        
        rm -rf AnyKernel3
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cd AnyKernel3
        
        rm -rf .git* README.md LICENSE
        
        # Configure for whyred with KernelSU
        cat > anykernel.sh << 'EOL'
        # AnyKernel3 Ramdisk Mod Script
        properties() { '
        kernel.string=KernelSU Next Extended for HyperOS 2 (whyred)
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=whyred
        device.name2=Redmi Note 5
        device.name3=Redmi Note 5 Pro
        supported.versions=14
        '; }
        
        block=/dev/block/bootdevice/by-name/boot;
        is_slot_device=0;
        ramdisk_compression=auto;
        patch_vbmeta_flag=auto;
        
        . tools/ak3-core.sh;
        
        set_perm_recursive 0 0 755 644 $ramdisk/*;
        set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;
        
        dump_boot;
        write_boot;
        EOL
        
        # Copy kernel
        cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
        
        # Create version info
        BUILD_DATE=$(date)
        cat > version.txt << EOL
        KernelSU Next Extended Build Information
        ========================================
        Build Date: $BUILD_DATE
        Android Version: ${{ github.event.inputs.ANDROID_VERSION }}
        KernelSU Version: ${{ github.event.inputs.KSU_VERSION }}
        Kernel: 4.4.302-Extended
        ROM: HyperOS 2
        Device: Xiaomi Redmi Note 5 (whyred)
        Builder: GitHub Actions
        
        KernelSU Features:
        - Full root access
        - Module support
        - Kernel-level su management
        - Android 14 compatibility
        EOL
        
        # Create flashable zip
        ZIP_NAME="KSU-Extended-HyperOS2-A${{ github.event.inputs.ANDROID_VERSION }}-$(date +%Y%m%d-%H%M).zip"
        zip -r9 "../$ZIP_NAME" * -x '*.git*'
        
        cd ..
        echo "✓ Flashable zip created: $ZIP_NAME"
        ls -lh *.zip

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Extended-Kernel-Image
        path: kernel/out/arch/arm64/boot/Image.gz-dtb
        compression-level: 9
        retention-days: 30
        if-no-files-found: error

    - name: Upload Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        name: KSU-Extended-Flashable-Zip
        path: KSU-Extended-*.zip
        compression-level: 9
        retention-days: 30
        if-no-files-found: error

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log
        path: kernel/build.log
        compression-level: 9
        retention-days: 7
        if-no-files-found: ignore

    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: KSU-Extended-A${{ github.event.inputs.ANDROID_VERSION }}-${{ github.run_number }}
        name: KernelSU Extended HyperOS 2 - Build ${{ github.run_number }}
        body: |
          ## KernelSU Extended for HyperOS 2
          ### Xiaomi Redmi Note 5 (whyred)
          
          - **Android Version:** ${{ github.event.inputs.ANDROID_VERSION }}
          - **KernelSU Version:** ${{ github.event.inputs.KSU_VERSION }}
          - **Kernel Base:** 4.4.302-Extended
          - **Build Date:** $(date)
          
          ### Features:
          - ✅ KernelSU root solution
          - ✅ Full KPROBES support
          - ✅ Module management
          - ✅ Android 14 compatibility
          - ✅ Extended kernel optimizations
          
          ### Installation:
          1. **Backup** your current boot.img
          2. Boot to custom recovery (TWRP/OrangeFox)
          3. Flash the zip file
          4. Wipe cache/dalvik
          5. Reboot
          6. Install **KernelSU Manager** APK
          
          ### Requirements:
          - Unlocked bootloader
          - HyperOS 2 ROM
          - Custom recovery
          
          ⚠️ **WARNING:** Only for HyperOS 2 Android 14!
          ⚠️ Always backup before flashing!
        files: |
          KSU-Extended-*.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

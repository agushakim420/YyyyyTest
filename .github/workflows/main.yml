    - name: Skip KernelSU (Test Build)
      run: |
        cd kernel
        echo "=== Building without KernelSU to test base kernel ==="
        
        # Remove any KernelSU references
        rm -rf KernelSU
        rm -rf drivers/kernelsu
        
        # Remove KernelSU from Makefile if exists
        if grep -q "kernelsu" Makefile; then
          sed -i '/kernelsu/d' Makefile
        fi
        
        if grep -q "kernelsu" drivers/Makefile; then
          sed -i '/kernelsu/d' drivers/Makefile
        fi
